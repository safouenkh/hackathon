[project]
name = "dalila-backend"
version = "0.1.0"
description = "Dalila (AFI) : backend FastAPI de l'agent IA pour les investisseurs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.30",
    "rdflib>=7.1,<8",          # ontologie (Turtle, SKOS) : BSD-3-Clause
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "pypdf>=5",                # tests : libellés des formulaires comparés au texte des PDF (BSD-3-Clause)
]
# Banc de test des outils avec un LLM (scripts/banc_llm_gemini.py) ; l'agent final est le travail du rôle 1.
llm-test = [
    "google-genai>=1.30",
]
# Recherche dans les cahiers des charges (outil regles_zone). Installer d'abord PyTorch avec CUDA :
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
vecteurs = [
    "qdrant-client>=1.12",     # client Qdrant : Apache-2.0
    "FlagEmbedding>=1.3",      # modèle BAAI/bge-m3 (dense + lexical) : MIT
]

# Seul `backend` est du code Python à installer (migrations/ et ontology/ sont des données).
[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
