[project]
name = "dalila-backend"
version = "0.1.0"
description = "Dalila (AFI) : backend FastAPI de l'agent IA pour les investisseurs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]
# Banc de test des outils avec un LLM (scripts/banc_llm_gemini.py) ; l'agent final est le travail du rôle 1.
llm-test = [
    "google-genai>=1.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
