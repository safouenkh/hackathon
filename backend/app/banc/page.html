<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banc Dalila</title>
<style>
  :root {
    --fond: #f4f6f8; --carte: #ffffff; --texte: #1c2430; --doux: #5b6673; --bord: #dde3ea;
    --accent: #0b5cad; --accent-doux: #e6f0fb; --vert: #1f7a4a; --vert-doux: #e5f4ec;
    --rouge: #b42318; --rouge-doux: #fdecea; --ambre: #8a5a00; --ambre-doux: #fff4dc;
    --moi: #0b5cad; --moi-texte: #ffffff; --code: #f1f4f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #11161c; --carte: #1a212a; --texte: #e6ebf1; --doux: #9aa6b4; --bord: #2c3642;
      --accent: #6aa9ec; --accent-doux: #1d2e44; --vert: #5cc48c; --vert-doux: #16302a;
      --rouge: #f0857b; --rouge-doux: #3a1d1b; --ambre: #f0c060; --ambre-doux: #352a12;
      --moi: #2f6fb5; --moi-texte: #ffffff; --code: #141a21;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 20px;
           background: var(--carte); border-bottom: 1px solid var(--bord); }
  header h1 { font-size: 17px; margin: 0; }
  header .note { color: var(--doux); font-size: 13px; }
  header .espace { flex: 1; }
  .pastille { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px;
              background: var(--accent-doux); color: var(--accent); white-space: nowrap; }
  main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px;
         padding: 16px 20px; height: calc(100vh - 58px); }
  section { background: var(--carte); border: 1px solid var(--bord); border-radius: 10px;
            display: flex; flex-direction: column; min-height: 0; }
  section h2 { font-size: 14px; margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--bord); color: var(--doux); }
  #fil, #trace { flex: 1; overflow-y: auto; padding: 14px; }
  .msg { margin: 0 0 14px; max-width: 92%; }
  .msg.moi { margin-left: auto; }
  .bulle { padding: 10px 13px; border-radius: 12px; white-space: normal; overflow-wrap: anywhere; }
  .moi .bulle { background: var(--moi); color: var(--moi-texte); border-bottom-right-radius: 4px; }
  .dalila .bulle { background: var(--fond); border: 1px solid var(--bord); border-bottom-left-radius: 4px; }
  .ligne { margin: 0 0 4px; min-height: 1em; }
  .puce { padding-inline-start: 14px; position: relative; }
  .puce::before { content: "•"; position: absolute; inset-inline-start: 2px; color: var(--doux); }
  .balise { display: inline-block; padding: 1px 8px; margin: 1px 2px; border-radius: 6px; font-size: 13px;
            border: 1px solid var(--bord); background: var(--carte); }
  .balise.lot { border-color: var(--accent); color: var(--accent); }
  .balise.zone { border-color: var(--vert); color: var(--vert); }
  .balise.choix { cursor: pointer; background: var(--accent-doux); color: var(--accent); border-color: var(--accent);
                  font: inherit; font-size: 13px; }
  .balise.choix:hover { filter: brightness(0.95); }
  .meta { font-size: 12px; color: var(--doux); margin-top: 5px; display: flex; gap: 8px; flex-wrap: wrap; }
  .controle { margin-top: 6px; font-size: 13px; padding: 6px 9px; border-radius: 8px; }
  .controle.ok { background: var(--vert-doux); color: var(--vert); }
  .controle.ko { background: var(--rouge-doux); color: var(--rouge); }
  .controle ul { margin: 4px 0 0; padding-inline-start: 18px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--bord); align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 44px; max-height: 140px; padding: 10px; border-radius: 8px;
             border: 1px solid var(--bord); background: var(--fond); color: var(--texte); font: inherit; }
  button { font: inherit; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
  .envoyer { background: var(--accent); color: #fff; padding: 10px 16px; }
  .envoyer:disabled { opacity: .55; cursor: wait; }
  .secondaire { background: transparent; border-color: var(--bord); color: var(--texte); padding: 6px 10px; font-size: 13px; }
  .exemples { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 10px; }
  .exemples button { background: var(--fond); border: 1px solid var(--bord); color: var(--texte);
                     padding: 4px 9px; font-size: 12.5px; }
  .compteur { font-size: 11px; color: var(--doux); padding: 0 14px 6px; text-align: end; }
  .appel { border: 1px solid var(--bord); border-radius: 8px; margin-bottom: 10px; }
  .appel > summary { padding: 8px 10px; cursor: pointer; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .appel .nom { font-weight: 600; font-family: ui-monospace, Consolas, monospace; }
  .appel .corps { padding: 0 10px 10px; }
  .av { display: inline-block; font-size: 11.5px; padding: 1px 6px; border-radius: 5px;
        background: var(--ambre-doux); color: var(--ambre); margin: 1px; }
  .av.err { background: var(--rouge-doux); color: var(--rouge); }
  pre { background: var(--code); border: 1px solid var(--bord); border-radius: 6px; padding: 8px; margin: 6px 0 0;
        font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
        max-height: 320px; overflow: auto; }
  .tour { font-size: 12px; color: var(--doux); margin: 4px 0 8px; }
  .vide { color: var(--doux); font-size: 13px; }
  .attente { color: var(--doux); font-style: italic; }
  .micro { background: var(--fond); border-color: var(--bord); color: var(--texte); padding: 10px 12px; }
  .micro.actif { background: var(--rouge-doux); border-color: var(--rouge); color: var(--rouge); }
  .micro:disabled { opacity: .55; cursor: wait; }
  .secondaire[aria-pressed="true"] { background: var(--vert-doux); border-color: var(--vert); color: var(--vert); }
  .ecouter { background: transparent; border: 1px solid var(--bord); color: var(--texte); font-size: 12px; padding: 1px 8px; }
  .voixnote { font-size: 12px; color: var(--ambre); }
  .bulle a { color: var(--accent); }
  .sources { margin-top: 6px; font-size: 13px; border: 1px solid var(--bord); border-radius: 8px; padding: 4px 9px;
             background: var(--carte); }
  .sources > summary { cursor: pointer; color: var(--doux); }
  .source { padding: 6px 0; border-top: 1px solid var(--bord); }
  .source:first-of-type { border-top: 0; }
  .source a { color: var(--accent); }
  .source .date { color: var(--doux); font-size: 12px; }
  .extrait > summary { cursor: pointer; font-size: 12px; color: var(--doux); }
  .texte-source { white-space: pre-wrap; font-size: 12.5px; background: var(--code); border-radius: 6px; padding: 6px 8px;
                  max-height: 220px; overflow: auto; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; height: auto; padding: 12px 16px; }
    section { min-height: 60vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Banc de test Dalila</h1>
  <span class="pastille" id="modele">modèle…</span>
  <span class="note">Rôle 3 : test des outils avec un LLM. Ce n'est pas l'interface finale.</span>
  <span class="espace"></span>
  <span class="pastille" id="etatvoix" title="Service langues et voix (Dalila_Language)">voix…</span>
  <button class="secondaire" id="lecture" type="button" aria-pressed="false" title="Lire chaque réponse à voix haute">🔊 Lecture : non</button>
  <button class="secondaire" id="nouvelle" type="button">Nouvelle conversation</button>
</header>
<main>
  <section aria-label="Conversation">
    <h2>Conversation</h2>
    <div id="fil" aria-live="polite"></div>
    <div class="exemples" id="exemples"></div>
    <form id="formulaire">
      <textarea id="saisie" maxlength="500" dir="auto" placeholder="Pose une question dans n'importe quelle langue… (Entrée pour envoyer)" aria-label="Question"></textarea>
      <button class="micro" id="micro" type="button" title="Parler (cliquer pour commencer, puis pour arrêter)" aria-label="Micro">🎤</button>
      <button class="envoyer" id="envoyer" type="submit">Envoyer</button>
    </form>
    <div class="compteur" id="compteur">0 / 500</div>
  </section>
  <section aria-label="Trace des outils">
    <h2>Appels d'outils de la dernière question</h2>
    <div id="trace"><p class="vide">Les appels d'outils (arguments, durée, avertissements, JSON complet) s'afficheront ici.</p></div>
  </section>
</main>
<script>
(() => {
  const EXEMPLES = [
    "Je cherche un lot de 3000 m² près d'un port, le moins cher possible",
    "n7eb terrain f Sfax",
    "La banque me demande un papier pour mon prêt",
    "Combien coûte une copie conforme ?",
    "Je veux un permis de construire",
    "Réserve-moi le lot 7079",
    "Compare les lots 7079, 7094 et 4138",
    "عندي مشروع سردين، شنوة الأرض اللي تنجم تناسبني قريب من الميناء؟",
  ];
  const $ = (id) => document.getElementById(id);
  const fil = $("fil"), trace = $("trace"), saisie = $("saisie"), envoyer = $("envoyer");

  function nouvelleSession() {
    const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/[^A-Za-z0-9]/g, "");
    try { sessionStorage.setItem("banc_session", id); } catch (e) {}
    return id;
  }
  let session;
  try { session = sessionStorage.getItem("banc_session"); } catch (e) {}
  if (!session) session = nouvelleSession();

  function el(tag, classe, texte) {
    const n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texte !== undefined) n.textContent = texte;
    return n;
  }

  // Rendu sûr : aucun innerHTML ; les balises [[...]] deviennent des éléments.
  const BALISE = /\[\[(ZONE|LOT|CHOIX|PDF):([^\]]*)\]\]/g;
  function rendreBalise(type, contenu) {
    if (type === "CHOIX") {
      const b = el("button", "balise choix", contenu);
      b.type = "button";
      b.title = "Envoyer ce choix";
      b.addEventListener("click", () => poser(contenu));
      return b;
    }
    if (type === "PDF") {
      const m = contenu.match(/^(https:\/\/[^\s]+?):([^:]*)$/);
      if (!m) return el("span", "balise", "PDF : " + contenu);
      const a = el("a", "balise", "📄 " + (m[2] || "document"));
      a.href = m[1]; a.target = "_blank"; a.rel = "noopener noreferrer";
      return a;
    }
    const i = contenu.indexOf(":");
    const id = i >= 0 ? contenu.slice(0, i) : contenu;
    const nom = i >= 0 ? contenu.slice(i + 1) : "";
    const n = el("span", "balise " + type.toLowerCase(), (type === "LOT" ? "🏭 " : "📍 ") + (nom || "(sans nom)"));
    n.title = type + " " + id;
    return n;
  }
  function rendreGras(parent, texte) {
    texte.split(/(\*\*[^*]+\*\*)/g).forEach((morceau) => {
      if (/^\*\*[^*]+\*\*$/.test(morceau)) parent.appendChild(el("strong", "", morceau.slice(2, -2)));
      else if (morceau) parent.appendChild(document.createTextNode(morceau.replace(/\*/g, "")));
    });
  }
  // **gras** et liens [texte](https://… ou /formulaire/…) : jamais d'adresse brute affichée
  const LIEN = /\[([^\]]+)\]\(((?:https?:\/\/|\/)[^)\s]+)\)/g;
  function rendreTexteEnrichi(parent, texte) {
    let dernier = 0;
    texte.replace(LIEN, (tout, libelle, url, pos) => {
      rendreGras(parent, texte.slice(dernier, pos));
      const a = el("a", "", libelle); a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
      parent.appendChild(a);
      dernier = pos + tout.length;
      return tout;
    });
    rendreGras(parent, texte.slice(dernier));
  }

  function rendreSources(sources) {
    const d = el("details", "sources");
    d.appendChild(el("summary", "", "📚 Sources (" + sources.length + ")"));
    sources.forEach((s) => {
      const bloc = el("div", "source");
      const lien = s.url && /^https?:\/\//.test(s.url);
      const titre = lien ? el("a", "", s.titre) : el("strong", "", s.titre);
      if (lien) { titre.href = s.url; titre.target = "_blank"; titre.rel = "noopener noreferrer"; }
      bloc.appendChild(titre);
      if (s.date) bloc.appendChild(el("span", "date", " · lu le " + s.date));
      if (s.a_verifier) bloc.appendChild(el("span", "av", "à vérifier : " + s.a_verifier));
      if (s.extrait) {
        const x = el("details", "extrait");
        x.appendChild(el("summary", "", "texte exact de la source"));
        const p = el("div", "texte-source", s.extrait); p.dir = "auto";
        x.appendChild(p);
        bloc.appendChild(x);
      }
      d.appendChild(bloc);
    });
    return d;
  }
  function rendreMessage(texte) {
    const bloc = el("div", "bulle");
    bloc.dir = "auto";
    (texte || "").split("\n").forEach((ligne) => {
      let classe = "ligne";
      const puce = ligne.match(/^\s*[*-]\s+(.*)$/);
      if (puce) { ligne = puce[1]; classe += " puce"; }
      const p = el("div", classe);
      let dernier = 0;
      ligne.replace(BALISE, (tout, type, contenu, pos) => {
        rendreTexteEnrichi(p, ligne.slice(dernier, pos));
        p.appendChild(rendreBalise(type, contenu));
        dernier = pos + tout.length;
        return tout;
      });
      rendreTexteEnrichi(p, ligne.slice(dernier));
      bloc.appendChild(p);
    });
    return bloc;
  }

  function ajouter(qui, contenu) {
    const m = el("div", "msg " + qui);
    m.appendChild(contenu);
    fil.appendChild(m);
    fil.scrollTop = fil.scrollHeight;
    return m;
  }

  function rendreControle(c) {
    const box = el("div", "controle " + (c.ok ? "ok" : "ko"));
    if (c.ok) { box.textContent = "✓ Contrôle : tous les nombres et toutes les balises viennent des outils."; return box; }
    box.appendChild(el("strong", "", "⚠ Contrôle après rédaction"));
    const ul = el("ul");
    if (c.nombres_non_trouves.length) ul.appendChild(el("li", "", "Nombres absents des données : " + c.nombres_non_trouves.join(", ")));
    if (c.chiffres_modifies.length) ul.appendChild(el("li", "", "Chiffres modifiés : " + c.chiffres_modifies.join(" ; ")));
    if (c.balises_inventees.length) ul.appendChild(el("li", "", "Balises inventées : " + c.balises_inventees.join(" ")));
    box.appendChild(ul);
    return box;
  }

  function rendreTrace(question, appels) {
    trace.replaceChildren();
    trace.appendChild(el("p", "tour", "Question : " + question));
    if (!appels.length) { trace.appendChild(el("p", "vide", "Aucun outil appelé : la réponse ne s'appuie sur aucune donnée de la base.")); return; }
    appels.forEach((a, i) => {
      const d = el("details", "appel");
      if (i === appels.length - 1) d.open = true;
      const s = el("summary");
      s.appendChild(el("span", "nom", a.outil));
      s.appendChild(el("span", "pastille", a.ms + " ms"));
      if (a.erreur) s.appendChild(el("span", "av err", a.erreur));
      (a.avertissements || []).forEach((c) => s.appendChild(el("span", "av", c)));
      d.appendChild(s);
      const corps = el("div", "corps");
      corps.appendChild(el("div", "tour", "Arguments choisis par le LLM"));
      corps.appendChild(el("pre", "", JSON.stringify(a.arguments, null, 2)));
      corps.appendChild(el("div", "tour", "Réponse de l'outil (données de la base)"));
      corps.appendChild(el("pre", "", JSON.stringify(a.resultat, null, 2)));
      d.appendChild(corps);
      trace.appendChild(d);
    });
  }

  let occupe = false;
  async function poser(question) {
    question = (question || "").trim();
    if (!question || occupe) return;
    occupe = true; envoyer.disabled = true;
    ajouter("moi", rendreMessage(question));
    const attente = ajouter("dalila", el("div", "bulle attente", "Dalila réfléchit…"));
    try {
      const r = await fetch("/banc/message", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, message: question }),
      });
      const corps = await r.json().catch(() => ({}));
      attente.remove();
      if (!r.ok) {
        const code = corps && corps.detail && corps.detail.code;
        ajouter("dalila", el("div", "bulle", code === "cle_gemini_absente"
          ? "Clé Gemini absente : ajoute GEMINI_API_KEY dans .env puis redémarre l'API."
          : "Erreur " + r.status + " : requête refusée."));
        return;
      }
      const m = ajouter("dalila", rendreMessage(corps.reponse));
      if (corps.sources && corps.sources.length) m.appendChild(rendreSources(corps.sources));
      m.appendChild(rendreControle(corps.controle));
      if (corps.donnees_masquees && corps.donnees_masquees.length) {
        m.appendChild(el("div", "controle ok", "🔒 Retiré avant l'envoi au modèle : " + corps.donnees_masquees.join(", ")
          + ". Ces informations se saisissent sur la page du formulaire."));
      }
      const meta = el("div", "meta");
      meta.appendChild(el("span", "", corps.modele + (corps.repli ? " (modèle de repli)" : "")));
      meta.appendChild(el("span", "", corps.duree_s + " s"));
      meta.appendChild(el("span", "", corps.appels.length + " appel(s) d'outil"));
      meta.appendChild(el("span", "", "jetons : " + corps.jetons.entree + " entrée / " + corps.jetons.sortie + " sortie"));
      const ecouter = el("button", "ecouter", "🔊 Écouter"); ecouter.type = "button";
      ecouter.addEventListener("click", () => lireAVoixHaute(corps.reponse, m));
      meta.appendChild(ecouter);
      m.appendChild(meta);
      if (lectureActive) lireAVoixHaute(corps.reponse, m);
      rendreTrace(question, corps.appels);
      fil.scrollTop = fil.scrollHeight;
    } catch (e) {
      attente.remove();
      ajouter("dalila", el("div", "bulle", "API injoignable : vérifie que le serveur tourne."));
    } finally {
      occupe = false; envoyer.disabled = false; saisie.focus();
    }
  }

  // ---------- Voix (BF7 à BF9, BNF8) : service local Dalila_Language via /voix ----------
  let lectureActive = false;
  $("lecture").addEventListener("click", () => {
    lectureActive = !lectureActive;
    $("lecture").setAttribute("aria-pressed", String(lectureActive));
    $("lecture").textContent = "🔊 Lecture : " + (lectureActive ? "oui" : "non");
  });

  async function lireAVoixHaute(texte, message) {
    const note = el("div", "voixnote", "Synthèse vocale…");
    message.appendChild(note);
    try {
      const r = await fetch("/voix/lire", { method: "POST", headers: { "Content-Type": "application/json" },
                                            body: JSON.stringify({ texte: (texte || "").slice(0, 4000) }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { note.textContent = "Voix indisponible : la réponse reste en texte."; return; }
      const audio = el("audio"); audio.controls = true;
      audio.src = "data:audio/wav;base64," + d.audio_base64;
      note.textContent = "Voix : " + d.langue + " (" + (d.moteur || "?") + ")"
        + (d.voix_arabe_generique ? " — dialecte lu avec une voix arabe générique" : "");
      message.appendChild(audio);
      audio.play().catch(() => {});      // lecture automatique parfois bloquée : le lecteur reste visible
    } catch (e) { note.textContent = "Voix injoignable : la réponse reste en texte."; }
  }

  let enregistreur = null, morceaux = [], accordMicro = false;
  async function basculerMicro() {
    const bouton = $("micro");
    if (enregistreur && enregistreur.state === "recording") { enregistreur.stop(); return; }
    if (!accordMicro) {
      accordMicro = window.confirm("Le micro enregistre votre question pour la transcrire sur ce serveur local. "
        + "L'audio n'est pas conservé. Autoriser le micro ?");
      if (!accordMicro) return;
    }
    let flux;
    try { flux = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { ajouter("dalila", el("div", "bulle", "Micro refusé ou indisponible : écrivez votre question.")); return; }
    morceaux = [];
    enregistreur = new MediaRecorder(flux);
    enregistreur.ondataavailable = (e) => { if (e.data.size) morceaux.push(e.data); };
    enregistreur.onstop = async () => {
      flux.getTracks().forEach((t) => t.stop());
      bouton.classList.remove("actif"); bouton.textContent = "⏳"; bouton.disabled = true;
      const blob = new Blob(morceaux, { type: enregistreur.mimeType || "audio/webm" });
      try {
        const r = await fetch("/voix/transcrire", { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
        const d = await r.json().catch(() => ({}));
        if (!r.ok || !d.texte) { ajouter("dalila", el("div", "bulle", "Je n'ai pas compris l'audio : réessayez ou écrivez votre question.")); return; }
        saisie.value = d.texte; majCompteur();          // BF7 : le texte reconnu est affiché avant l'envoi
        poser(d.texte);
      } catch (e) { ajouter("dalila", el("div", "bulle", "Reconnaissance vocale injoignable : écrivez votre question.")); }
      finally { bouton.textContent = "🎤"; bouton.disabled = false; saisie.value = ""; majCompteur(); }
    };
    enregistreur.start();
    bouton.classList.add("actif"); bouton.textContent = "⏹";
  }
  $("micro").addEventListener("click", basculerMicro);
  fetch("/voix/etat").then((r) => r.json()).then((e) => {
    $("etatvoix").textContent = e.disponible
      ? "voix : prête" + (e.voix_tunisienne === "ready" ? " (tunisienne)" : " (arabe générique pour le tunisien)")
      : "voix : indisponible";
  }).catch(() => { $("etatvoix").textContent = "voix : indisponible"; });

  $("formulaire").addEventListener("submit", (e) => { e.preventDefault(); const q = saisie.value; saisie.value = ""; majCompteur(); poser(q); });
  saisie.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("formulaire").requestSubmit(); } });
  function majCompteur() { $("compteur").textContent = saisie.value.length + " / 500"; }
  saisie.addEventListener("input", majCompteur);
  $("nouvelle").addEventListener("click", async () => {
    try { await fetch("/banc/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session }) }); } catch (e) {}
    session = nouvelleSession();
    fil.replaceChildren();
    trace.replaceChildren(el("p", "vide", "Nouvelle conversation."));
  });
  EXEMPLES.forEach((q) => {
    const b = el("button", "", q); b.type = "button"; b.dir = "auto";
    b.addEventListener("click", () => poser(q));
    $("exemples").appendChild(b);
  });
  fetch("/banc/info").then((r) => r.json()).then((i) => {
    $("modele").textContent = i.modele + (i.repli && i.repli.length ? " · repli : " + i.repli.join(", ") : "")
      + (i.cle_presente ? "" : " — clé absente");
  }).catch(() => {});
})();
</script>
</body>
</html>
