services:
  postgres:
    image: postgres:18.7
    container_name: dalila-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    ports:
      # Exposé uniquement sur la machine locale
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      # PostgreSQL 18 : le volume se monte sur /var/lib/postgresql (PGDATA = .../18/docker)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Index vectoriel des passages (recherche hybride dense + lexicale, BGE-M3). Le texte de
  # référence reste dans PostgreSQL ; l'index se reconstruit avec scripts.indexer_passages.
  qdrant:
    image: qdrant/qdrant:v1.20.2
    container_name: dalila-qdrant
    ports:
      # Exposé uniquement sur la machine locale (aucune authentification configurée)
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
